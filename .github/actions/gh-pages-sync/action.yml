name: Sync a gh-pages subfolder
description: >
  Replace (or delete) one subfolder of the gh-pages branch and push, retrying on
  a rejected push. Concurrent pull requests share that one branch, each owning
  only its own pr-<N>/ subfolder, so a parallel push makes ours non-fast-forward
  — the recurring cause of a red preview on an otherwise fine pull request.

inputs:
  subdir:
    description: the subfolder to rewrite, e.g. pr-42
    required: true
  source:
    description: directory to copy into it; empty means delete the subfolder
    required: false
    default: ""
  message:
    description: commit message
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SUBDIR: ${{ inputs.subdir }}
        SOURCE: ${{ inputs.source }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        if [ -n "$SOURCE" ] && { [ ! -d "$SOURCE" ] || [ -z "$(ls -A "$SOURCE" 2>/dev/null)" ]; }; then
          echo "nothing rendered in $SOURCE — skipping"
          exit 0
        fi
        git config user.name "Manfred Touron"
        git config user.email "94029+moul@users.noreply.github.com"

        # Rebuild our own subfolder on the LATEST gh-pages each attempt. Since
        # we only ever rewrite that one subfolder, replaying is idempotent and
        # cannot clobber another pull request's preview.
        for attempt in 1 2 3 4 5; do
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          rm -rf .ghp; git worktree prune
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add -q .ghp origin/gh-pages
            ( cd .ghp && git checkout -q -B gh-pages )
          elif [ -z "$SOURCE" ]; then
            echo "no gh-pages branch — nothing to clean"
            exit 0
          else
            git worktree add -q --detach .ghp
            ( cd .ghp && git checkout -q --orphan gh-pages && git reset -q --hard >/dev/null 2>&1
              rm -rf ./* ./.[!.]* 2>/dev/null || true; : > .nojekyll )
          fi

          rm -rf ".ghp/$SUBDIR"
          if [ -n "$SOURCE" ]; then
            mkdir -p ".ghp/$SUBDIR"
            cp -r "$SOURCE/." ".ghp/$SUBDIR/"
          fi

          ( cd .ghp && git add -A )
          if ( cd .ghp && git diff --cached --quiet ); then
            echo "gh-pages already matches — nothing to push"
            git worktree remove --force .ghp
            exit 0
          fi
          ( cd .ghp && git commit -q -m "$MESSAGE" )
          if ( cd .ghp && git push -q origin gh-pages ); then
            echo "pushed on attempt $attempt"
            git worktree remove --force .ghp
            exit 0
          fi
          echo "push rejected (gh-pages moved); replaying on latest — attempt $attempt"
          git worktree remove --force .ghp
          sleep $((RANDOM % 5 + 2))
        done
        echo "::error::could not sync gh-pages/$SUBDIR after 5 attempts"
        exit 1
