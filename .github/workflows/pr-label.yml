name: pr-label

# Auto-label each PR by the paths it touches:
#   p     — pure packages under p/
#   r     — realms under r/
#   meta  — repo infrastructure ONLY: .github/, tools/, Makefile, root docs
#           (README/AGENTS/CLAUDE/DISCLAIMER), go.mod, gnowork.toml, .gitattributes
#   other — source outside p/ r/ and the meta set
# vendor/, _assets/, and contracts.json are NEUTRAL (dependency / generated
# artifacts, not PR intent) — they contribute no label. The workflow reconciles
# these four managed labels (adds those that apply, removes those that no longer
# do); any other label (manual ones like enhancement/bug) is left untouched.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute + apply path labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE" --depth=100
          p=0; r=0; meta=0; other=0
          while read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              p/*) p=1 ;;
              r/*) r=1 ;;
              # repo infrastructure only
              .github/*|tools/*|Makefile|go.mod|go.sum|gnowork.toml|.gitattributes|.gitignore|README.md|AGENTS.md|CLAUDE.md|DISCLAIMER.md) meta=1 ;;
              # neutral: dependency + generated artifacts contribute no label
              vendor/*|_assets/*|contracts.json) ;;
              *) other=1 ;;
            esac
          done < <(git diff --name-only "origin/$BASE...HEAD")
          # Reconcile the 4 managed labels: add those that apply, remove those
          # that don't. Any other (manual) label is left untouched.
          args=()
          for pair in "p:$p" "r:$r" "meta:$meta" "other:$other"; do
            name=${pair%:*}; on=${pair#*:}
            if [ "$on" = 1 ]; then args+=(--add-label "$name"); else args+=(--remove-label "$name"); fi
          done
          echo "reconciling: ${args[*]}"
          gh pr edit "$PR" -R "$REPO" "${args[@]}"
