name: gnobench

# What a storage change costs, measured, and said out loud on the pull request
# that makes it.
#
# Two triggers, two different jobs, because they answer different questions:
#
#   pull_request  "did this change move any number?" -> measure only the
#                 candidates whose package the diff touched, compare against
#                 the numbers already committed for this runner, and write the
#                 delta into the job summary. It never commits and never fails
#                 the build: a benchmark that blocks a merge on a 3% wobble
#                 teaches everyone to ignore it.
#
#   schedule      "did the toolchain move any number?" -> re-measure the whole
#                 suite against current gno master and commit the result. The
#                 runner is its own machine, so it writes its own result file
#                 and nobody's laptop numbers are overwritten.
#
# The runner is slower and noisier than a laptop, which is fine: gas and byte
# counts are deterministic, and those are the columns anything is decided on.

on:
  pull_request:
    paths:
      - "p/**"
      - "vendor/**"
      - "gnobench/**"
      - ".github/workflows/gnobench.yml"
  schedule:
    # 05:20 on Mondays.
    - cron: "20 5 * * 1"
  workflow_dispatch:
    inputs:
      sizes:
        description: "element counts, comma separated"
        required: false
        default: "100,1000"

permissions:
  contents: read

jobs:
  delta:
    name: what this pull request moved
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A pull request gets one size and one value shape. The full matrix is the
    # weekly job's business; a review needs "did this move" in minutes, not
    # every number again.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-gno
        with:
          binaries: gno

      - name: Build gnobench
        run: go -C gnobench build -o gnobench .

      # Before measuring anything: does the committed README still match the
      # committed results? Measuring first would make it legitimately stale and
      # the check meaningless.
      - name: Is the README's generated region up to date
        working-directory: gnobench
        run: ./gnobench report -check

      # Only what the diff could have changed. `affected` prints one of
      # "skip", "all" or "filter:<regexp>" and always exits 0 for all three:
      # signalling "nothing to measure" with a non-zero exit used to fail this
      # job on every pull request that touched no benched package, because the
      # runner invokes the step as `bash -e` and an assignment from a failing
      # command kills the shell before any handler runs.
      - name: Which candidates does this touch
        id: scope
        run: |
          set -euo pipefail
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed.txt
          DECISION=$(./gnobench/gnobench affected -suite storage < /tmp/changed.txt)
          case "$DECISION" in
            skip)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No benched package changed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            all)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "filter=" >> "$GITHUB_OUTPUT"
              echo "measuring the whole suite"
              ;;
            filter:*)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "filter=${DECISION#filter:}" >> "$GITHUB_OUTPUT"
              echo "measuring ${DECISION#filter:}"
              ;;
            *)
              echo "::error::gnobench affected printed an unexpected decision: $DECISION"
              exit 1
              ;;
          esac

      - name: Save the committed baseline for this runner
        if: steps.scope.outputs.skip != 'true'
        id: base
        run: |
          set -euo pipefail
          ID=$(./gnobench/gnobench env -id)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          git show "${{ github.event.pull_request.base.sha }}:gnobench/results/storage/$ID.json" \
            > /tmp/base.json 2>/dev/null || rm -f /tmp/base.json

      - name: Measure
        if: steps.scope.outputs.skip != 'true'
        working-directory: gnobench
        env:
          FILTER: ${{ steps.scope.outputs.filter }}
        run: |
          set -euo pipefail
          if [ -n "$FILTER" ]; then
            ./gnobench run -suite storage -n 1000 -value str -repeat 2 -filter "$FILTER"
          else
            ./gnobench run -suite storage -n 1000 -value str -repeat 2
          fi

      - name: Report the delta
        if: steps.scope.outputs.skip != 'true'
        run: |
          ./gnobench/gnobench compare \
            -base /tmp/base.json \
            -head "gnobench/results/storage/${{ steps.base.outputs.id }}.json" \
            -threshold 2 \
            -title "gnobench: what this pull request moved" >> "$GITHUB_STEP_SUMMARY"

  refresh:
    name: re-measure against gno master
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-gno
        with:
          binaries: gno

      - name: Build gnobench
        run: go -C gnobench build -o gnobench .

      - name: Measure the whole suite
        working-directory: gnobench
        run: |
          ./gnobench run -suite storage \
            -n "${{ github.event.inputs.sizes || '100,1000' }}" \
            -value str,obj -repeat 2
          ./gnobench run -suite wiring -n 100,1000 -repeat 2
          ./gnobench run -suite digest -n 32,256,1024,8192 -value str -repeat 2

      - name: Regenerate the reports
        working-directory: gnobench
        run: ./gnobench report

      - name: Commit if anything moved
        run: |
          set -euo pipefail

          # README.md belongs in this list. `gnobench report` rewrites its
          # generated region, and the delta job runs `report -check`, which
          # exits 1 when that region disagrees with results/. Committing the
          # results without the README therefore turns every later pull
          # request red.
          paths=(gnobench/results gnobench/reports gnobench/README.md)

          if git diff --quiet -- "${paths[@]}"; then
            echo "nothing moved" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # This job measures for half an hour, so main moves underneath it and
          # a bare `git push` loses the race, taking every measurement with it.
          # That is exactly how the first run of this job died: run
          # 36868485814 on 2026-10-01 measured all three suites and was then
          # rejected by a merge that had landed 31 minutes earlier.
          #
          # Rebase rather than merge. Result files are one per machine and this
          # runner only ever writes its own, so the rebase cannot conflict on
          # them; the reports and the README are a pure function of every
          # result file, so they are regenerated on top of whatever the rebase
          # brought in instead of being text-merged.
          for attempt in 1 2 3; do
            git add -- "${paths[@]}"
            git commit -q -m "chore(gnobench): re-measure against gno master [skip ci]" || true
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              git rebase --abort || true
              echo "rebase onto origin/main conflicted; nothing committed" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            ./gnobench/gnobench report -root gnobench
            git add -- "${paths[@]}"
            git commit -q --amend --no-edit
            if git push; then
              git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push attempt $attempt rejected, rebasing and retrying" >&2
            sleep $((attempt * 5))
          done
          echo "could not push after 3 attempts" >> "$GITHUB_STEP_SUMMARY"
          exit 1
