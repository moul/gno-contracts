name: regen

# After anything lands on main, regenerate the derived artifacts and commit them
# — so PRs never have to carry (or conflict on) generated files. PRs are
# source-only; this is the single writer of:
#   - contracts.json      (catalog: adds/removes contracts, marks ignored)
#   - README.md table
#   - per-package README footers (repo link, disclaimer, embedded deps graph)
#   - _assets/**           (per-package + global dependency graphs)
#
# Idempotent: a run that changes nothing commits nothing. Commits pushed here use
# GITHUB_TOKEN, which by design does not re-trigger workflows, so there is no loop.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *" # hourly self-heal: catch anything a push run missed
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: regen
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # Regenerate on the LATEST main each attempt, then push. Never rebase the
      # generated files — publish-status writes the same contracts.json/README.md,
      # so a rebase conflicts and the push fails. On a rejected push, reset to
      # fresh main, re-run make gen/graph, and retry (regeneration is idempotent).
      - name: Regenerate and push
        run: |
          git config user.name "Manfred Touron"
          git config user.email "94029+moul@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            make gen
            make graph
            git add -A
            if git diff --cached --quiet; then
              echo "Nothing to regenerate."
              exit 0
            fi
            git commit -q -m "chore: regenerate catalog + READMEs + graphs"
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (main moved); regenerating on latest — attempt $attempt"
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push regen after 5 attempts"
          exit 1
