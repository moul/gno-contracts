name: copilot-review-log

# Every Copilot code review, digested into one hub issue (#280), so the
# reviewer gets better instead of merely being tolerated. One entry per finding
# with three boxes; the false-positive box asks which line of
# .github/copilot-instructions.md or .github/instructions/* produced it.
#
# A SWEEP on a clock, not a `pull_request_review` trigger, and that is measured
# rather than preferred. A run triggered by Copilot's review is held as
# `action_required` (Copilot counts as a first-time contributor), the approve
# endpoint refuses it ("not from a fork pull request"), and a re-run by hand
# re-evaluates the original payload, where the job's login gate skipped. Seen on
# #295, 2026-10-01, run 36870684808: an event-driven log needs a click per
# review, so it logs nothing. A sweep needs no approval.
#
# Idempotent: a review is skipped when a comment by the owner or this bot on
# the hub already links `#pullrequestreview-<id>`, which also covers digests
# written by hand. Only those two count, because anyone can comment on the hub
# and a pasted link would suppress that digest.
#
# Costs Actions seconds. No AI, no key, nothing metered.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      since_hours:
        description: "look at pull requests updated in the last N hours"
        default: "48"

permissions:
  contents: read
  pull-requests: read
  issues: write # the digest comments on the hub

concurrency:
  group: copilot-review-log
  cancel-in-progress: false

env:
  HUB: 280

jobs:
  log:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      SINCE_HOURS: ${{ inputs.since_hours || '48' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod

      # The API calls live here and nowhere else: `gnocontracts copilot-log` is
      # network-free on purpose, which is what lets it be table-tested against
      # real captured reviews instead of a mock.
      #
      # Every API call is assigned before it is used, so `set -e` stops the run
      # on a failure. `for x in $(cmd)` and a trailing `|| true` both swallow
      # one, and an empty "already logged" set would repost every digest.
      #
      # `gh api --paginate` with `--jq` emits ONE ARRAY PER PAGE, so the
      # comments go through `jq -s 'add // []'` to merge the pages first.
      - name: Digest every Copilot review not yet on the hub
        run: |
          set -euo pipefail
          bodies=$(gh api --paginate "repos/$REPO/issues/$HUB/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" or .user.login == env.OWNER) | .body')
          logged=$(grep -o 'pullrequestreview-[0-9]*' <<<"$bodies" | cut -d- -f2 | sort -u || [ $? = 1 ])
          since=$(date -u -d "-$SINCE_HOURS hours" +%Y-%m-%dT%H:%M:%SZ)
          prs=$(gh pr list -R "$REPO" --state all --search "updated:>=$since" \
            --limit 1000 --json number --jq '.[].number' | sort -n)
          for pr in $prs; do
            rids=$(gh api --paginate "repos/$REPO/pulls/$pr/reviews" \
              --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]") | .id')
            for rid in $rids; do
              if grep -qx "$rid" <<<"$logged"; then continue; fi
              pr_json=$(gh api "repos/$REPO/pulls/$pr" --jq '{number, title, html_url, user: .user.login}')
              review=$(gh api "repos/$REPO/pulls/$pr/reviews/$rid")
              comments=$(gh api --paginate "repos/$REPO/pulls/$pr/comments?per_page=100" \
                --jq "[.[] | select(.pull_request_review_id == $rid)]" | jq -s 'add // []')
              jq -n --argjson pr "$pr_json" --argjson review "$review" --argjson comments "$comments" \
                '{pr: $pr, review: $review, comments: $comments}' \
                | go -C tools tool gnocontracts copilot-log > digest.md
              if [ ! -s digest.md ]; then continue; fi
              gh issue comment "$HUB" -R "$REPO" --body-file digest.md
              echo "logged #$pr review $rid"
            done
          done
