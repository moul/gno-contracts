name: gnopublish-ci

# Build, vet and unit-test the gnopublish tool. It is a separate, heavy module
# (it links the full gno client stack), so it runs ONLY when tools/gnopublish
# changes: it must not slow every pull request down.
#
# Its go.mod `replace` points at a local gno checkout, because the tool tracks
# gno master rather than a release. Here it is repointed at a fresh clone.
on:
  pull_request:
    paths: ["tools/gnopublish/**"]
  push:
    branches: [main]
    paths: ["tools/gnopublish/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/gnopublish
    env:
      GOFLAGS: -mod=mod
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      # This module pins its own Go version, higher than the root module's.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/gnopublish/go.mod

      - name: Clone gno master and repoint the replace
        run: |
          git clone --quiet --depth=1 https://github.com/gnolang/gno "$HOME/gno"
          go mod edit -replace github.com/gnolang/gno="$HOME/gno"

      - name: Build, vet and test
        run: |
          go build ./...
          go vet ./...
          go test ./...
