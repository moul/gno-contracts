name: publish-status

# Refresh each contract's on-chain upload status (per network) and commit the
# updated contracts.json + README table. Runs after every push to main and can
# be triggered manually. The commit is tagged [skip ci] so it does not loop.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping runs racing on the same commit.
concurrency:
  group: publish-status
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # gno + gnokey from master, OUTSIDE the workspace (so the gnowork.toml
      # workspace never discovers the toolchain's bundled packages).
      - name: Build gno + gnokey (master)
        run: |
          git clone --depth 1 https://github.com/gnolang/gno "$HOME/gno"
          mkdir -p "$HOME/.local/bin"
          (cd "$HOME/gno" \
            && go build -o "$HOME/.local/bin/gno" ./gnovm/cmd/gno \
            && go build -o "$HOME/.local/bin/gnokey" ./gno.land/cmd/gnokey)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GNOROOT=$HOME/gno" >> "$GITHUB_ENV"

      # Regenerate the status on the LATEST main each attempt, then push. Never
      # rebase the generated files (contracts.json/README.md) — the regen bot
      # writes the same files, so a rebase conflicts and the push silently fails
      # (that stalled the status refresh entirely). Instead, on a rejected push,
      # reset to fresh main, re-run `make status`, and retry. `make status` is
      # deterministic given on-chain state, so regenerating is always safe.
      - name: Refresh on-chain status and push
        run: |
          git config user.name "Manfred Touron"
          git config user.email "94029+moul@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            make status
            if [ -z "$(git status --porcelain contracts.json README.md)" ]; then
              echo "No status changes."
              exit 0
            fi
            git add contracts.json README.md
            git commit -q -m "chore(status): refresh on-chain publish status [skip ci]"
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (main moved); regenerating on latest — attempt $attempt"
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push status after 5 attempts"
          exit 1
