name: no-generated-files

# Guard: a PR must carry only SOURCE. contracts.json and _assets/ are generated
# on `main` by the `regen` / `publish-status` workflows after merge — committing
# them in a PR is the recurring cause of merge conflicts (every main-side regen
# re-conflicts the PR). This job fails a PR that modifies any generated path.
#
# README.md is a SPECIAL CASE: it is part generated (the contracts table, the
# dependency-graph section) and part hand-written prose. Rejecting the whole file
# also blocked fixing stale prose, which the regenerator never touches. So the
# check compares only the generated REGIONS (tools/readme_regions.py): a PR that
# edits prose passes, one that edits the table or the graph section fails.

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject generated-file changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # three-dot: diff the merge-base..head, i.e. only what THIS PR changed.
          # (two-dot would also flag files that merely advanced on main — e.g. the
          # regen/status bots' contracts.json — falsely failing older PRs.)
          bad=$(git diff --name-only "$BASE...$HEAD" -- \
                  contracts.json '_assets' '_assets/**')
          if [ -n "$bad" ]; then
            echo "::error::This PR modifies generated files. Remove them — they are"
            echo "::error::regenerated on 'main' by the regen/publish-status workflows."
            echo "Offending paths:"
            echo "$bad" | sed 's/^/  - /'
            echo
            echo "Fix: git checkout origin/main -- contracts.json _assets"
            exit 1
          fi

          # README.md: allow prose edits, reject changes to the generated regions.
          if git diff --name-only "$BASE...$HEAD" -- README.md | grep -q .; then
            base_mb=$(git merge-base "$BASE" "$HEAD")
            git show "$base_mb:README.md" > /tmp/readme-base.md 2>/dev/null || : > /tmp/readme-base.md
            git show "$HEAD:README.md"   > /tmp/readme-head.md 2>/dev/null || : > /tmp/readme-head.md

            # Use the guard script as of the MERGE BASE, so a PR cannot weaken
            # the check by editing the extractor in the same commit.
            git show "$base_mb:tools/readme_regions.py" > /tmp/readme_regions.py 2>/dev/null \
              || cp tools/readme_regions.py /tmp/readme_regions.py

            python3 /tmp/readme_regions.py /tmp/readme-base.md > /tmp/regions-base.txt
            python3 /tmp/readme_regions.py /tmp/readme-head.md > /tmp/regions-head.txt

            if ! diff -q /tmp/regions-base.txt /tmp/regions-head.txt >/dev/null; then
              echo "::error::This PR changes the GENERATED regions of README.md (the"
              echo "::error::contracts table and/or the dependency-graph section). Those are"
              echo "::error::rewritten on 'main' by the regen workflow — committing them here"
              echo "::error::only creates conflicts."
              echo
              diff -u /tmp/regions-base.txt /tmp/regions-head.txt | head -40 || true
              echo
              echo "Fix: git checkout origin/main -- README.md, then re-apply only your prose edits."
              exit 1
            fi
            echo "README.md: only hand-written prose changed — allowed."
          fi

          echo "OK — PR touches only source files."
