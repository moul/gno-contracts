name: CI

# The gate: the guards, then lint and test for every contract against a gno
# built from master.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: gnomod.lock pins
      # superseded versions to the commits that still hold them, and
      # `gnopm sync` reads them back with `git archive`. A depth-1
      # checkout has none of those commits, so every pinned version would
      # fail to materialize.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod

      # First, and before the toolchain build: a pull request carrying a
      # generated file is rejected in seconds rather than after nine minutes.
      # contracts.json and _assets/ are rewritten on main by the `main`
      # workflow, so committing them here only creates a conflict with the next
      # regeneration. README.md is the exception — part generated, part prose —
      # and only its generated regions are compared, so a PR may still fix a
      # stale paragraph.
      - name: Guard the generated artifacts
        if: github.event_name == 'pull_request'
        run: |
          go -C tools tool gnocontracts guard-generated \
            -base "${{ github.event.pull_request.base.sha }}" \
            -head "${{ github.event.pull_request.head.sha }}"

      - uses: ./.github/actions/setup-gno
        with:
          binaries: gno

      - name: gno version
        run: gno version

      # gnomod.lock is SOURCE, not a generated artifact: a PR that adds,
      # removes or bumps a package carries its lock entry, because the pin is
      # what keeps the version it replaced resolvable for everything that
      # still imports it.
      #
      # `tool ci` rather than `verify`: same three failures (the lock describes
      # the tree, every pinned version reproduces byte-for-byte from history,
      # no pin would be discarded by a squash merge, which a pin to a commit
      # living only on this branch would be), plus a fourth check `verify`
      # cannot make and a Markdown report in the job summary.
      #
      # The fourth is a WARNING, not a failure: a pull request that changes a
      # package's production .gno files without moving its module line, where
      # that version is already live or parked on the chain. A public package
      # path cannot be redeployed, so such an edit can never reach the chain
      # and this tree silently stops matching what is deployed. That is how
      # r/moul/x/reaper/v0 shipped a rendering fix it could never receive
      # (#193, corrected by #196): every check here was green, correctly, and
      # the lock is exactly what stays right while this goes wrong.
      #
      # No --comment on purpose. The job summary is enough and this repository
      # already posts two bot comments per pull request.
      #
      # gnopm works out the upstream ref itself: GITHUB_BASE_REF on a pull
      # request, otherwise origin/HEAD.
      - name: Verify gnomod.lock
        run: |
          git fetch --quiet origin "${{ github.base_ref || github.ref_name }}" || true
          go -C tools tool gnopm tool ci

      # Materialize the versions that no longer have a directory, so lint and
      # test can build them and so packages importing them resolve.
      - name: Materialize pinned versions
        run: go -C tools tool gnopm sync

      - name: Vet tools
        run: go -C tools vet ./...

      - name: Test tools
        run: go -C tools test ./...

      # Committed vendor/ is the pinned, authoritative source of gno.land/*
      # dependencies. We do NOT re-vendor from live master here (that would
      # couple CI to monorepo drift). lint/test resolve deps from vendor/ via
      # the Makefile's stdlib-only GNOROOT view (empty examples/). Dependency
      # bumps are deliberate: run `make deps` locally and commit.
      # Prove the toolchain actually validates example tests, and that no
      # Example* is silently skipped (missing // Output:) — otherwise an
      # ExampleRender is a false-green test that asserts nothing.
      - name: Validate example tests are real
        run: make toolcheck guard-examples guard-render guard-readmes

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # NOTE: no `make check` here. PRs carry only package SOURCE — the
      # generated catalog (contracts.json), README table, and _assets/ graphs
      # are NOT expected to be fresh in a PR. They are regenerated on `main`
      # after merge by the `main` workflow, so PRs never conflict on them.
