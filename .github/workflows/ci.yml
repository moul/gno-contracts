name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build the gno toolchain from gnolang/gno master, then test/lint every contract
# and verify the generated catalog is up to date.
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Checkout gno (master)
        uses: actions/checkout@v4
        with:
          repository: gnolang/gno
          ref: master
          path: .gno

      - name: Build gno toolchain
        run: |
          mkdir -p "$HOME/.local/bin"
          (cd .gno && go build -o "$HOME/.local/bin/gno" ./gnovm/cmd/gno)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GNOROOT=$GITHUB_WORKSPACE/.gno" >> "$GITHUB_ENV"

      - name: gno version
        run: gno version

      - name: Build & vet tools
        run: |
          go vet ./tools
          make tools

      - name: Vendor dependencies (verify committed vendor is current)
        run: |
          make deps
          git diff --exit-code -- vendor/ \
            || (echo "::error::vendor/ is out of date — run 'make deps' and commit"; exit 1)

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Catalog up to date (contracts.json + README table)
        run: make check
