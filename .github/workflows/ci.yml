name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build the gno toolchain from gnolang/gno master, then test/lint every contract
# and verify the generated catalog is up to date.
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: gnomod.lock pins
      # superseded versions to the commits that still hold them, and
      # `gnopm sync` reads them back with `git archive`. A depth-1
      # checkout has none of those commits, so every pinned version would
      # fail to materialize.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # Clone the gno toolchain OUTSIDE the repo workspace. If it lived inside
      # (e.g. ./.gno), the gnowork.toml workspace would discover its bundled
      # examples/ + pkg/mod packages and they would shadow our committed
      # vendor/, breaking reproducible resolution.
      - name: Checkout & build gno (master), outside the workspace
        run: |
          git clone --depth 1 https://github.com/gnolang/gno "$HOME/gno"
          mkdir -p "$HOME/.local/bin"
          (cd "$HOME/gno" && go build -o "$HOME/.local/bin/gno" ./gnovm/cmd/gno)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GNOROOT=$HOME/gno" >> "$GITHUB_ENV"

      - name: gno version
        run: gno version

      # gnomod.lock is SOURCE, not a generated artifact: a PR that adds,
      # removes or bumps a package carries its lock entry, because the pin is
      # what keeps the version it replaced resolvable for everything that
      # still imports it. This proves the lock still describes the tree and
      # that every pinned version still reproduces byte-for-byte from history.
      # On a pull request, also require every pinned commit to be reachable
      # from the base branch. A pin to a commit that exists only on the PR's
      # own branch is fine until the branch is squash-merged, at which point
      # the commit is unreachable and the version it held stops resolving for
      # good. Catching it here is cheap; catching it after the merge is not.
      - name: Verify gnomod.lock
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            go tool gnopm verify -upstream "origin/${{ github.base_ref }}"
          else
            go tool gnopm verify
          fi

      # Materialize the versions that no longer have a directory, so lint and
      # test can build them and so packages importing them resolve.
      - name: Materialize pinned versions
        run: go tool gnopm sync

      - name: Vet tools
        run: go vet ./tools/...

      - name: Test tools
        run: go test ./tools/...

      # Committed vendor/ is the pinned, authoritative source of gno.land/*
      # dependencies. We do NOT re-vendor from live master here (that would
      # couple CI to monorepo drift). lint/test resolve deps from vendor/ via
      # the Makefile's stdlib-only GNOROOT view (empty examples/). Dependency
      # bumps are deliberate: run `make deps` locally and commit.
      # Prove the toolchain actually validates example tests, and that no
      # Example* is silently skipped (missing // Output:) — otherwise an
      # ExampleRender is a false-green test that asserts nothing.
      - name: Validate example tests are real
        run: make toolcheck guard-examples guard-render

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # NOTE: no `make check` here. PRs carry only package SOURCE — the generated
      # catalog (contracts.json), README table, and _assets/ graphs are NOT
      # expected to be fresh in a PR. They are regenerated on `main` after merge
      # by the `regen` workflow, so PRs never conflict on generated files.
