name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build the gno toolchain from gnolang/gno master, then test/lint every contract
# and verify the generated catalog is up to date.
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Checkout gno (master)
        uses: actions/checkout@v4
        with:
          repository: gnolang/gno
          ref: master
          path: .gno

      - name: Build gno toolchain
        run: |
          mkdir -p "$HOME/.local/bin"
          (cd .gno && go build -o "$HOME/.local/bin/gno" ./gnovm/cmd/gno)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GNOROOT=$GITHUB_WORKSPACE/.gno" >> "$GITHUB_ENV"

      - name: gno version
        run: gno version

      - name: Vet tools
        run: go vet ./tools/...

      # Committed vendor/ is the pinned, authoritative source of gno.land/*
      # dependencies. We do NOT re-vendor from live master here (that would
      # couple CI to monorepo drift). lint/test resolve deps from vendor/ via
      # the Makefile's stdlib-only GNOROOT view (empty examples/). Dependency
      # bumps are deliberate: run `make deps` locally and commit.
      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Catalog up to date (contracts.json + README table)
        run: make check
