<svg xmlns="http://www.w3.org/2000/svg" width="860" height="268" viewBox="0 0 860 268" role="img" aria-label="Gas for ONE read, cold, against 10,000 entries"><rect width="860" height="268" rx="8" fill="#fcfcfb"/><style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><text x="16" y="20" font-size="14" font-weight="600" fill="#0b0b0b">Gas for ONE read, cold, against 10,000 entries</text><text x="16" y="38" font-size="11" fill="#898781">what a realm pays per call: the container was committed by an earlier transaction and this one touches it once. Off the scale, cut so the rest is</text><text x="16" y="52" font-size="11" fill="#898781">readable: builtin []struct, sorted at 5,300,799, builtin map[string]any at 5,594,926, builtin map[string]string at 5,594,956.</text><rect x="268" y="66.5" width="336.5" height="13" rx="4" fill="#2a78d6"/><text x="258" y="77.5" font-size="12" text-anchor="end" fill="#0b0b0b">p/nt/avl/v0</text><text x="610.5" y="77.5" font-size="11" text-anchor="start" fill="#52514e">253,035</text><rect x="268" y="92.5" width="346.2" height="13" rx="4" fill="#2a78d6"/><text x="258" y="103.5" font-size="12" text-anchor="end" fill="#0b0b0b">p/nt/bptree/v0 fanout=32</text><text x="620.2" y="103.5" font-size="11" text-anchor="start" fill="#52514e">260,358</text><rect x="268" y="118.5" width="362.2" height="13" rx="4" fill="#2a78d6"/><text x="258" y="129.5" font-size="12" text-anchor="end" fill="#0b0b0b">p/nt/bptree/v0 fanout=8</text><text x="636.2" y="129.5" font-size="11" text-anchor="start" fill="#52514e">272,380</text><rect x="268" y="144.5" width="405.6" height="13" rx="4" fill="#2a78d6"/><text x="258" y="155.5" font-size="12" text-anchor="end" fill="#0b0b0b">p/nt/bptree/v0 fanout=4</text><text x="679.6" y="155.5" font-size="11" text-anchor="start" fill="#52514e">305,046</text><rect x="268" y="170.5" width="409.1" height="13" rx="4" fill="#2a78d6"/><text x="258" y="181.5" font-size="12" text-anchor="end" fill="#0b0b0b">256x p/nt/avl/v0, hash-sharded</text><text x="683.1" y="181.5" font-size="11" text-anchor="start" fill="#52514e">307,652</text><rect x="268" y="196.5" width="428.1" height="13" rx="4" fill="#2a78d6"/><text x="258" y="207.5" font-size="12" text-anchor="end" fill="#0b0b0b">p/moul/cow/v0</text><text x="702.1" y="207.5" font-size="11" text-anchor="start" fill="#52514e">321,930</text><rect x="268" y="222.5" width="496.0" height="13" rx="4" fill="#2a78d6"/><text x="258" y="233.5" font-size="12" text-anchor="end" fill="#0b0b0b">p/nt/bptree/v0 fanout=128</text><text x="770.0" y="233.5" font-size="11" text-anchor="start" fill="#52514e">373,011</text><line x1="268" x2="268" y1="60" y2="242.0" stroke="#c3c2b7" stroke-width="1"/><text x="268" y="259" font-size="11" fill="#898781">lower is better</text></svg>
