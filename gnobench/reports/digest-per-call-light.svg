<svg xmlns="http://www.w3.org/2000/svg" width="860" height="242" viewBox="0 0 860 242" role="img" aria-label="Gas per call on an 8,192-byte input"><rect width="860" height="242" rx="8" fill="#fcfcfb"/><style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><text x="16" y="20" font-size="14" font-weight="600" fill="#0b0b0b">Gas per call on an 8,192-byte input</text><text x="16" y="38" font-size="11" fill="#898781">amortised over 64 calls, so the input build is subtracted out. Off the scale, cut so the rest is readable: strconv (hand-rolled hex) at 336,877,484.</text><text x="16" y="52" font-size="11" fill="#898781">Logarithmic scale, so each gridline is 10x the one before it.</text><line x1="268.0" x2="268.0" y1="60" y2="216.0" stroke="#e1e0d9" stroke-width="1"/><line x1="392.0" x2="392.0" y1="60" y2="216.0" stroke="#e1e0d9" stroke-width="1"/><line x1="516.0" x2="516.0" y1="60" y2="216.0" stroke="#e1e0d9" stroke-width="1"/><line x1="640.0" x2="640.0" y1="60" y2="216.0" stroke="#e1e0d9" stroke-width="1"/><line x1="764.0" x2="764.0" y1="60" y2="216.0" stroke="#e1e0d9" stroke-width="1"/><circle cx="378.0" cy="73.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="258" y="77.5" font-size="12" text-anchor="end" fill="#0b0b0b">crypto/sha256</text><text x="384.0" y="77.5" font-size="11" text-anchor="start" fill="#52514e">77,108</text><circle cx="429.1" cy="99.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="258" y="103.5" font-size="12" text-anchor="end" fill="#0b0b0b">crypto/keccak256</text><text x="435.1" y="103.5" font-size="11" text-anchor="start" fill="#52514e">199,191</text><circle cx="670.5" cy="125.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="258" y="129.5" font-size="12" text-anchor="end" fill="#0b0b0b">hash/adler32</text><text x="676.5" y="129.5" font-size="11" text-anchor="start" fill="#52514e">17,604,648</text><circle cx="693.2" cy="151.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="258" y="155.5" font-size="12" text-anchor="end" fill="#0b0b0b">encoding/hex</text><text x="699.2" y="155.5" font-size="11" text-anchor="start" fill="#52514e">26,855,153</text><circle cx="700.9" cy="177.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="258" y="181.5" font-size="12" text-anchor="end" fill="#0b0b0b">encoding/base64</text><text x="706.9" y="181.5" font-size="11" text-anchor="start" fill="#52514e">31,000,489</text><circle cx="707.0" cy="203.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="258" y="207.5" font-size="12" text-anchor="end" fill="#0b0b0b">encoding/base32</text><text x="713.0" y="207.5" font-size="11" text-anchor="start" fill="#52514e">34,731,495</text><line x1="268" x2="268" y1="60" y2="216.0" stroke="#c3c2b7" stroke-width="1"/><text x="268" y="233" font-size="11" fill="#898781">lower is better</text></svg>
