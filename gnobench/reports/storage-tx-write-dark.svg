<svg xmlns="http://www.w3.org/2000/svg" width="860" height="268" viewBox="0 0 860 268" role="img" aria-label="Gas for ONE update, cold, against 10,000 entries"><rect width="860" height="268" rx="8" fill="#1a1a19"/><style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><text x="16" y="20" font-size="14" font-weight="600" fill="#ffffff">Gas for ONE update, cold, against 10,000 entries</text><text x="16" y="38" font-size="11" fill="#898781">overwriting one existing key: a single-object container rewrites all 10,000 entries, a per-entry container rewrites one path. Off the scale, cut so</text><text x="16" y="52" font-size="11" fill="#898781">the rest is readable: builtin map[string]any at 10,194,795, builtin map[string]string at 10,195,084, builtin []struct, sorted at 10,351,543.</text><rect x="268" y="66.5" width="263.0" height="13" rx="4" fill="#3987e5"/><text x="258" y="77.5" font-size="12" text-anchor="end" fill="#ffffff">p/nt/bptree/v0 fanout=32</text><text x="537.0" y="77.5" font-size="11" text-anchor="start" fill="#c3c2b7">340,196</text><rect x="268" y="92.5" width="277.2" height="13" rx="4" fill="#3987e5"/><text x="258" y="103.5" font-size="12" text-anchor="end" fill="#ffffff">p/nt/bptree/v0 fanout=8</text><text x="551.2" y="103.5" font-size="11" text-anchor="start" fill="#c3c2b7">358,551</text><rect x="268" y="118.5" width="320.1" height="13" rx="4" fill="#3987e5"/><text x="258" y="129.5" font-size="12" text-anchor="end" fill="#ffffff">p/nt/bptree/v0 fanout=4</text><text x="594.1" y="129.5" font-size="11" text-anchor="start" fill="#c3c2b7">414,110</text><rect x="268" y="144.5" width="358.6" height="13" rx="4" fill="#3987e5"/><text x="258" y="155.5" font-size="12" text-anchor="end" fill="#ffffff">p/nt/avl/v0</text><text x="632.6" y="155.5" font-size="11" text-anchor="start" fill="#c3c2b7">463,823</text><rect x="268" y="170.5" width="415.6" height="13" rx="4" fill="#3987e5"/><text x="258" y="181.5" font-size="12" text-anchor="end" fill="#ffffff">p/nt/bptree/v0 fanout=128</text><text x="689.6" y="181.5" font-size="11" text-anchor="start" fill="#c3c2b7">537,597</text><rect x="268" y="196.5" width="443.6" height="13" rx="4" fill="#3987e5"/><text x="258" y="207.5" font-size="12" text-anchor="end" fill="#ffffff">256x p/nt/avl/v0, hash-sharded</text><text x="717.6" y="207.5" font-size="11" text-anchor="start" fill="#c3c2b7">573,822</text><rect x="268" y="222.5" width="496.0" height="13" rx="4" fill="#3987e5"/><text x="258" y="233.5" font-size="12" text-anchor="end" fill="#ffffff">p/moul/cow/v0</text><text x="770.0" y="233.5" font-size="11" text-anchor="start" fill="#c3c2b7">641,611</text><line x1="268" x2="268" y1="60" y2="242.0" stroke="#383835" stroke-width="1"/><text x="268" y="259" font-size="11" fill="#898781">lower is better</text></svg>
