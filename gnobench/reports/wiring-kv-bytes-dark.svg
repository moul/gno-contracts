<svg xmlns="http://www.w3.org/2000/svg" width="860" height="228" viewBox="0 0 860 228" role="img" aria-label="Bytes the key/value store is asked to write"><rect width="860" height="228" rx="8" fill="#1a1a19"/><style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style><text x="16" y="20" font-size="14" font-weight="600" fill="#ffffff">Bytes the key/value store is asked to write</text><text x="16" y="38" font-size="11" fill="#898781">1,000 writes arriving one transaction at a time. Every one of these ends at the same state and is charged the same deposit.</text><rect x="268" y="52.5" width="71.9" height="13" rx="4" fill="#3987e5"/><text x="258" y="63.5" font-size="12" text-anchor="end" fill="#ffffff">p/moul/ulist/v1</text><text x="345.9" y="63.5" font-size="11" text-anchor="start" fill="#c3c2b7">11,310,583 (12x the batched write)</text><rect x="268" y="78.5" width="105.5" height="13" rx="4" fill="#3987e5"/><text x="258" y="89.5" font-size="12" text-anchor="end" fill="#ffffff">p/nt/bptree/v0 fanout=32</text><text x="379.5" y="89.5" font-size="11" text-anchor="start" fill="#c3c2b7">16,586,051 (28x the batched write)</text><rect x="268" y="104.5" width="112.5" height="13" rx="4" fill="#3987e5"/><text x="258" y="115.5" font-size="12" text-anchor="end" fill="#ffffff">p/nt/avl/v0</text><text x="386.5" y="115.5" font-size="11" text-anchor="start" fill="#c3c2b7">17,686,268 (9x the batched write)</text><rect x="268" y="130.5" width="220.1" height="13" rx="4" fill="#3987e5"/><text x="258" y="141.5" font-size="12" text-anchor="end" fill="#ffffff">p/nt/bptree/v0 fanout=128</text><text x="494.1" y="141.5" font-size="11" text-anchor="start" fill="#c3c2b7">34,604,796 (62x the batched write)</text><rect x="268" y="156.5" width="260.9" height="13" rx="4" fill="#3987e5"/><text x="258" y="167.5" font-size="12" text-anchor="end" fill="#ffffff">builtin []string</text><text x="534.9" y="167.5" font-size="11" text-anchor="start" fill="#c3c2b7">41,010,627 (510x the batched write)</text><rect x="268" y="182.5" width="496.0" height="13" rx="4" fill="#3987e5"/><text x="258" y="193.5" font-size="12" text-anchor="end" fill="#ffffff">builtin map[string]string</text><text x="754.0" y="193.5" font-size="11" text-anchor="end" fill="#c3c2b7">77,976,234 (505x the batched write)</text><line x1="268" x2="268" y1="46" y2="202.0" stroke="#383835" stroke-width="1"/><text x="268" y="219" font-size="11" fill="#898781">lower is better</text></svg>
